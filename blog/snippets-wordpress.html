<!--
  Bloques para pegar en WordPress (historywithaccent.com) con el bloque "HTML personalizado".
  Reemplazá CHRONOS_URL por la dirección de Chronos en Vercel si cambia.

  1) Pregunta del día ........ home del blog (o donde quieras).
  2) Pregunta de la historia .. dentro del artículo, por ejemplo después del Bite-Sized Quiz.
  3) Botón "Ready for more?" .. al final del artículo, junto a "Keep the streak alive!".

  El script del final ajusta el alto del iframe solo; pegalo UNA vez por página (en cualquiera de los bloques).
-->

<!-- 1) PREGUNTA DEL DÍA (home) -->
<div class="hwa-chronos" style="max-width:560px;margin:2rem auto;">
  <iframe
    src="CHRONOS_URL/embed/daily"
    title="Chronos · Question of the day"
    loading="lazy"
    style="width:100%;height:520px;border:0;border-radius:16px;overflow:hidden;display:block;"
  ></iframe>
</div>

<!-- 2) PREGUNTA DE LA HISTORIA (dentro del artículo de Antikythera) -->
<div class="hwa-chronos" style="max-width:560px;margin:2rem auto;">
  <iframe
    src="CHRONOS_URL/embed/daily?story=antikythera"
    title="Chronos · A question about the Antikythera Mechanism"
    loading="lazy"
    style="width:100%;height:520px;border:0;border-radius:16px;overflow:hidden;display:block;"
  ></iframe>
</div>

<!-- 3) BOTÓN AL FINAL DEL ARTÍCULO DE ANTIKYTHERA -->
<div style="max-width:560px;margin:2rem auto;padding:1.25rem 1.5rem;border:1px solid #e5d3a8;border-radius:14px;background:#fbf7ee;text-align:center;">
  <p style="margin:0 0 .25rem;font-weight:600;font-size:1.05rem;">Ready for more?</p>
  <p style="margin:0 0 1rem;color:#555;font-size:.95rem;">
    Put the Antikythera story to the test: 5 questions, then the rest of Ancient Greece.
    <br><em>¿Te animás? 5 preguntas sobre esta historia y después el resto de la Antigua Grecia.</em>
  </p>
  <a href="CHRONOS_URL/game/ancient-greece?story=antikythera"
     target="_blank" rel="noopener"
     style="display:inline-block;padding:.75rem 1.5rem;border-radius:999px;background:#09090f;color:#f5a623;font-weight:600;text-decoration:none;">
    Play in Chronos →
  </a>
</div>

<!-- Ajuste automático del alto de los iframes de Chronos (una vez por página) -->
<script>
  window.addEventListener('message', function (event) {
    if (event.origin !== 'CHRONOS_URL') return; // solo mensajes de Chronos
    if (!event.data || event.data.type !== 'chronos-embed-height') return;
    document.querySelectorAll('.hwa-chronos iframe').forEach(function (frame) {
      if (frame.contentWindow === event.source) frame.style.height = event.data.height + 'px';
    });
  });
</script>
